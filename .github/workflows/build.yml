name: Sweetch Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Download RAW samples
        shell: pwsh
        run: |
          # Public samples from raw.pixls.us (CC0) for the camera RAW tests.
          New-Item -ItemType Directory -Force raw-samples | Out-Null
          $samples = @{
            'canon_r6.CR3' = 'https://raw.pixls.us/data/Canon/EOS%20R6/Canon_EOS_R6_CRAW_ISO_100_nocrop_nodual.CR3'
            'iphone12pro.DNG' = 'https://raw.pixls.us/data/Apple/iPhone%2012%20Pro/IMG_1361.DNG'
          }
          # The sample site is sometimes down: try a few times, and without samples the RAW test skips
          # itself instead of failing a release.
          $got = 0
          foreach ($name in $samples.Keys) {
            for ($i = 1; $i -le 3; $i++) {
              try { Invoke-WebRequest $samples[$name] -OutFile "raw-samples/$name"; $got++; break }
              catch { Write-Warning "raw.pixls.us, try ${i}: $($_.Exception.Message)"; Start-Sleep -Seconds (5 * $i) }
            }
          }
          if ($got -eq $samples.Count) {
            "SWEETCH_RAW_SAMPLES=$PWD\raw-samples" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          } else {
            Write-Warning 'RAW samples unavailable: the camera RAW test is skipped in this run.'
          }
      - name: Test
        run: dotnet test tests/Sweetch.Tests -c Release
      - name: Build
        shell: pwsh
        run: ./build.ps1 -Version $(if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '2.1.2' })
      - name: Verify packaged app
        shell: pwsh
        run: |
          $p = Start-Process ./publish/Sweetch.exe -ArgumentList '--self-test', './self-test' -PassThru -Wait
          Get-Content ./self-test/self-test.txt
          if ($p.ExitCode -ne 0) { throw 'Sweetch self-test failed' }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '2.1.2' }
          Compress-Archive -Path ./publish/* -DestinationPath "./artifacts/Sweetch-$version-win-x64.zip"
          ./scripts/build-installer.ps1 -Version $version
          ./scripts/verify-installer.ps1 -Installer "./artifacts/Sweetch-$version-Setup-win-x64.exe"
          Get-FileHash ./artifacts/*.zip -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" | Out-File -Encoding ascii "$($_.Path).sha256"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: Sweetch-Windows
          path: artifacts/*
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Sweetch-previews
          path: self-test

  # Pushing a tag like v1.0.1 publishes the tested ZIP as a GitHub Release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/release-notes
      - uses: actions/download-artifact@v7
        with:
          name: Sweetch-Windows
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Written notes for the tag when there are any (.github/release-notes/v2.0.md), else GitHub's list of changes.
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then from=(--notes-file "$notes"); else from=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Sweetch ${GITHUB_REF_NAME#v}" "${from[@]}" artifacts/*
